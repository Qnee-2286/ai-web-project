<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="hi-build" content="20260615cachefix" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据看板｜AI全量初面系统</title>
    <link rel="stylesheet" href="./styles.css?v=20260615cachefix" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif; background: #F7FAFC; color: #0F172A; }
      .shell { display: flex; min-height: 100vh; }
      .side { width: 240px; background: #0D1B2A; display: flex; flex-direction: column; flex-shrink: 0; }
      .brand { padding: 20px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
      .brand-icon { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #0070FF, #00D68F); flex-shrink: 0; }
      .brand strong { display: block; color: #fff; font-size: 14px; font-weight: 700; line-height: 1.3; }
      .brand small { display: block; color: #94A3B8; font-size: 11px; margin-top: 2px; }
      .nav { padding: 8px 0; flex: 1; }
      .nav a { display: block; padding: 10px 16px 10px 13px; color: #94A3B8; text-decoration: none; font-size: 13px; border-left: 3px solid transparent; transition: all .15s; }
      .nav a:hover { color: #fff; background: rgba(255,255,255,0.04); }
      .nav a.active { color: #fff; border-left-color: #0070FF; background: rgba(0,112,255,0.08); }
      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .topbar { background: #fff; border-bottom: 1px solid #E2E8F0; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .page-title .crumb { font-size: 12px; color: #94A3B8; }
      .page-title h1 { font-size: 18px; font-weight: 700; margin: 4px 0 2px; }
      .page-title p { font-size: 13px; color: #475569; }
      .content { flex: 1; padding: 24px 28px; }
      .panel { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
      .dashboard-filter { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
      .field { display: flex; flex-direction: column; gap: 4px; }
      .field label { font-size: 12px; font-weight: 600; color: #475569; }
      .field select, .field input { padding: 7px 12px; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 13px; font: inherit; background: #fff; }
      .kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 20px; }
      .kpi-card { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; padding: 20px; text-align: center; }
      .kpi-card span { display: block; font-size: 12px; color: #94A3B8; margin-bottom: 4px; }
      .kpi-card strong { display: block; font-size: 32px; font-weight: 900; background: linear-gradient(135deg, #0070FF, #00D68F); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .kpi-card small { display: block; font-size: 12px; color: #475569; margin-top: 4px; }
      .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .chart-card { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; padding: 20px; }
      .chart-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
      .columns { display: flex; align-items: flex-end; gap: 12px; height: 180px; padding-top: 20px; }
      .column { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .column i { display: block; width: 100%; max-width: 48px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #0070FF, #00D68F); }
      .column span { font-size: 11px; color: #475569; }
      .pie-wrap { display: flex; align-items: center; gap: 24px; }
      .donut { width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(#00D68F 0% 26%, #FBBF24 26% 73%, #CBD5E1 73% 100%); flex-shrink: 0; }
      .donut.review { background: conic-gradient(#00D68F 0% 24%, #FBBF24 24% 67%, #CBD5E1 67% 100%); }
      .legend { display: flex; flex-direction: column; gap: 8px; }
      .legend span { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #475569; }
      .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
      .legend i.green { background: #00D68F; }
      .legend i.amber { background: #FBBF24; }
      .legend i.gray { background: #CBD5E1; }
      .bars { display: flex; flex-direction: column; gap: 12px; }
      .bar-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
      .bar-row span { width: 48px; color: #475569; text-align: right; flex-shrink: 0; }
      .bar-track { flex: 1; height: 8px; background: #F1F5F9; border-radius: 4px; overflow: hidden; }
      .bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #0070FF, #00D68F); transition: width .3s; }
      .bar-row strong { width: 28px; text-align: right; flex-shrink: 0; }
      .mps-beian { text-align: center; padding: 16px; font-size: 12px; color: #94A3B8; }
      .mps-beian a { color: #94A3B8; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
      .mps-beian img { width: 14px; height: 14px; }
      @media (max-width: 768px) { .kpi-grid { grid-template-columns: repeat(2,1fr); } .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <div class="brand"><img class="brand-icon" src="./assets/logo-icon.svg" alt="hi AI初面" style="background:none;padding:0;" /><span><strong>AI全量初面系统</strong><small>泓泽数字旗下产品</small></span></div>
        <nav class="nav">
          <a class="active" href="./dashboard.html">首页</a>
          <a href="./create-interview-flow.html?v=20260615cachefix">创建初面</a>
          <a href="./job-management.html">初面管理</a>
          <a href="./candidate-list.html">候选人</a>
          <a href="./report-review-list.html">报告复核</a>
          <a href="./question-bank.html">题库管理</a>
          <a href="./profile.html">设置</a>
        </nav>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="page-title">
            <span class="crumb">HR端 / 数据看板</span>
            <h1>数据看板</h1>
            <p>按岗位和时间查看初面推进情况，帮助HR判断哪里需要跟进。</p>
          </div>
        </div>
        <div class="content">
          <section class="panel dashboard-filter">
            <div class="field"><label>岗位</label><select><option>全部岗位</option><option>行政专员</option><option>HR助理</option><option>财务文员</option></select></div>
            <div class="field"><label>开始日期</label><input type="date" value="2026-04-01" /></div>
            <div class="field"><label>结束日期</label><input type="date" value="2026-04-29" /></div>
          </section>

          <div class="kpi-grid">
            <article class="kpi-card"><span>候选人总数</span><strong>36</strong><small>已进入初面流程</small></article>
            <article class="kpi-card"><span>完成面试</span><strong>21</strong><small>完成率 58%</small></article>
            <article class="kpi-card"><span>待HR复核</span><strong>7</strong><small>建议优先处理</small></article>
            <article class="kpi-card"><span>进入二面</span><strong>5</strong><small>由HR复核确认</small></article>
          </div>

          <div class="dashboard-grid">
            <article class="chart-card">
              <h3>面试状态分布</h3>
              <div class="columns" aria-label="面试状态分布图">
                <div class="column"><i style="height: 42px; background: #CBD5E1"></i><span>未接收</span></div>
                <div class="column"><i style="height: 82px"></i><span>待面试</span></div>
                <div class="column"><i style="height: 28px; background: #FBBF24"></i><span>面试中</span></div>
                <div class="column"><i style="height: 158px; background: #00D68F"></i><span>已完成</span></div>
              </div>
            </article>

            <article class="chart-card">
              <h3>HR复核结果</h3>
              <div class="pie-wrap">
                <div class="donut review" aria-label="HR复核结果环形图"></div>
                <div class="legend">
                  <span><i class="green"></i>进入二面 5</span>
                  <span><i class="amber"></i>暂缓推进 9</span>
                  <span><i class="gray"></i>待复核 7</span>
                </div>
              </div>
            </article>

            <article class="chart-card">
              <h3>学历分布</h3>
              <div class="bars">
                <div class="bar-row"><span>大专</span><div class="bar-track"><div class="bar-fill" style="width: 58%"></div></div><strong>14</strong></div>
                <div class="bar-row"><span>本科</span><div class="bar-track"><div class="bar-fill" style="width: 100%; background: linear-gradient(90deg, #0070FF, #00D68F)"></div></div><strong>24</strong></div>
                <div class="bar-row"><span>硕士</span><div class="bar-track"><div class="bar-fill" style="width: 8%; background: #FBBF24"></div></div><strong>2</strong></div>
              </div>
            </article>

            <article class="chart-card">
              <h3>工作年限</h3>
              <div class="bars">
                <div class="bar-row"><span>1年内</span><div class="bar-track"><div class="bar-fill" style="width: 32%"></div></div><strong>6</strong></div>
                <div class="bar-row"><span>1-3年</span><div class="bar-track"><div class="bar-fill" style="width: 100%; background: linear-gradient(90deg, #0070FF, #00D68F)"></div></div><strong>19</strong></div>
                <div class="bar-row"><span>3-5年</span><div class="bar-track"><div class="bar-fill" style="width: 58%; background: #FBBF24"></div></div><strong>11</strong></div>
              </div>
            </article>

          </div>
        </div>
      </main>
    </div>

    <div class="mps-beian">
      <a href="https://beian.mps.gov.cn/#/query/webSearch?code=44010302111445" rel="noreferrer" target="_blank">
        <img src="./assets/beian.png" alt="公安备案图标" />
        <span>粤公网安备44010302111445号</span>
      </a>
    </div>
    <script src="./auth-flow.js?v=20260615cachefix"></script>
</body>
</html>
