    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif; background: #F7FAFC; color: #0F172A; }
      .shell { display: flex; min-height: 100vh; }
      .side { width: 240px; background: #0D1B2A; display: flex; flex-direction: column; flex-shrink: 0; }
      .brand { padding: 20px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
      .brand-icon { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #0070FF, #00D68F); flex-shrink: 0; }
      .brand strong { display: block; color: #fff; font-size: 14px; font-weight: 700; line-height: 1.3; }
      .brand small { display: block; color: #94A3B8; font-size: 11px; margin-top: 2px; }
      .nav { padding: 8px 0; flex: 1; }
      .nav a { display: block; padding: 10px 16px 10px 13px; color: #94A3B8; text-decoration: none; font-size: 13px; border-left: 3px solid transparent; transition: all .15s; }
      .nav a:hover { color: #fff; background: rgba(255,255,255,0.04); }
      .nav a.active { color: #fff; border-left-color: #0070FF; background: rgba(0,112,255,0.08); }
      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .topbar { background: #fff; border-bottom: 1px solid #E2E8F0; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .page-title .crumb { font-size: 12px; color: #94A3B8; }
      .page-title h1 { font-size: 18px; font-weight: 700; margin: 4px 0 2px; }
      .page-title p { font-size: 13px; color: #475569; }
      .btn { display: inline-flex; align-items: center; justify-content: center; padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid #E2E8F0; background: #fff; color: #0F172A; cursor: pointer; transition: all .15s; }
      .btn:hover { border-color: #CBD5E1; }
      .btn.primary { background: linear-gradient(135deg, #0070FF, #00D68F); color: #fff; border: none; }
      .btn.primary:hover { opacity: .9; }
      .content { flex: 1; padding: 24px 28px; }
      .panel { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; }
      .review-status-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 20px; }
      .review-status-card { display: block; padding: 18px; text-decoration: none; color: inherit; transition: all .15s; }
      .review-status-card span { display: block; font-size: 12px; color: #94A3B8; margin-bottom: 4px; }
      .review-status-card strong { display: block; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #0070FF, #00D68F); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .review-status-card small { display: block; font-size: 12px; color: #475569; margin-top: 4px; }
      .review-status-card:hover { border-color: #0070FF; box-shadow: 0 2px 8px rgba(0,112,255,0.1); }
      .review-status-card.active { border-color: #0070FF; background: rgba(0,112,255,0.02); }
      .section-title h2 { font-size: 15px; font-weight: 700; padding: 16px 20px 0; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { padding: 10px 14px; text-align: left; background: #F8FAFC; color: #475569; font-weight: 600; border-bottom: 1px solid #E2E8F0; white-space: nowrap; }
      td { padding: 10px 14px; border-bottom: 1px solid #F1F5F9; color: #0F172A; }
      td[colspan] { text-align: center; color: #94A3B8; padding: 40px; }
      #batchBar { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; margin-bottom: 16px; }
      .mps-beian { text-align: center; padding: 16px; font-size: 12px; color: #94A3B8; }
      .mps-beian a { color: #94A3B8; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
      .mps-beian img { width: 14px; height: 14px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <div class="brand"><img class="brand-icon" src="./assets/logo-icon.svg" alt="hi AI初面" style="background:none;padding:0;" /><span><strong>AI全量初面系统</strong><small>泓泽数字旗下产品</small></span></div>
        <nav class="nav">
          <a href="./dashboard.html">首页</a>
          <a href="./create-interview-flow.html?v=20260615cachefix">创建初面</a>
          <a href="./job-management.html">初面管理</a>
          <a href="./candidate-list.html">候选人</a>
          <a class="active" href="./report-review-list.html">报告复核</a>
          <a href="./question-bank.html">题库管理</a>
          <a href="./profile.html">设置</a>
        </nav>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="page-title">
            <span class="crumb">HR端 / 报告复核</span>
            <h1>报告复核</h1>
            <p>这里展示当前账号下已完成初面、等待HR复核的候选人报告。面试编号用于后续查询、复核和争议留痕。</p>
          </div>
          <a class="btn primary" href="./candidate-list.html">查看候选人</a>
        </div>
        <div class="content">
          <section class="review-status-grid">
            <a class="panel review-status-card active" data-review-filter="pending" href="./report-review-list.html?status=pending"><span>待复核</span><strong id="reviewCount">0</strong><small>需要HR确认下一步</small></a>
            <a class="panel review-status-card" data-review-filter="continue" href="./report-review-list.html?status=continue"><span>已推进</span><strong id="reviewContinueCount">0</strong><small>进入二面或继续沟通</small></a>
            <a class="panel review-status-card" data-review-filter="hold" href="./report-review-list.html?status=hold"><span>待定</span><strong id="reviewHoldCount">0</strong><small>需要补充信息</small></a>
            <a class="panel review-status-card" data-review-filter="reject" href="./report-review-list.html?status=reject"><span>暂不推进</span><strong id="reviewRejectCount">0</strong><small>本次先不进入下一轮</small></a>
          </section>

          <!-- 批量操作栏 -->
          <section id="batchBar" style="display:none;padding:12px 20px;">
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                <input type="checkbox" id="selectAllCb" /> <strong>全选</strong>
              </label>
              <span id="batchSelectedInfo" style="color:#94A3B8;">已选 0 项</span>
              <div style="flex:1"></div>
              <button class="btn" type="button" id="batchContinueBtn" style="font-size:13px;">批量推进</button>
              <button class="btn" type="button" id="batchHoldBtn" style="font-size:13px;">批量待定</button>
              <button class="btn" type="button" id="batchRejectBtn" style="font-size:13px;">批量暂不推进</button>
            </div>
          </section>

          <section class="panel">
            <div class="section-title"><h2>待复核报告</h2></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th><input type="checkbox" id="headerSelectAll" /></th><th>面试编号</th><th>候选人</th><th>应聘岗位</th><th>简历</th><th>面试状态</th><th>更新时间</th><th>操作</th></tr>
                </thead>
                <tbody id="reviewReportRows">
                  <tr><td colspan="8">暂无待复核报告。候选人完成初面后会出现在这里。</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div class="mps-beian"><a href="https://beian.mps.gov.cn/#/query/webSearch?code=44010302111445" rel="noreferrer" target="_blank"><img src="./assets/beian.png" alt="公安备案图标" /><span>粤公网安备44010302111445号</span></a></div>
    <script src="./common.js?v=20260615cachefix"></script>
    <script src="./auth-flow.js?v=20260615cachefix"></script>
    <script>
    (function(){
      // 批量操作逻辑
      var batchBar = document.getElementById('batchBar');
      var selectAllCb = document.getElementById('selectAllCb');
      var headerSelectAll = document.getElementById('headerSelectAll');
      var batchInfo = document.getElementById('batchSelectedInfo');
      var rows = document.getElementById('reviewReportRows');

      function getCheckedIds() {
        var cbs = rows.querySelectorAll('input[type="checkbox"].row-cb:checked');
        var ids = [];
        cbs.forEach(function(cb){ ids.push(cb.value); });
        return ids;
      }

      function updateBatchUI() {
        var ids = getCheckedIds();
        if (batchInfo) batchInfo.textContent = '已选 ' + ids.length + ' 项';
        if (batchBar) batchBar.style.display = ids.length > 0 ? '' : 'none';
        // 同步全选状态
        var allCbs = rows.querySelectorAll('input[type="checkbox"].row-cb');
        var allChecked = allCbs.length > 0 && ids.length === allCbs.length;
        if (selectAllCb) selectAllCb.checked = allChecked;
        if (headerSelectAll) headerSelectAll.checked = allChecked;
      }

      function toggleAll(checked) {
        var cbs = rows.querySelectorAll('input[type="checkbox"].row-cb');
        cbs.forEach(function(cb){ cb.checked = checked; });
        updateBatchUI();
      }

      if (selectAllCb) selectAllCb.addEventListener('change', function(){ toggleAll(this.checked); });
      if (headerSelectAll) headerSelectAll.addEventListener('change', function(){ toggleAll(this.checked); });

      // 监听表格行checkbox变化（事件委托）
      rows.addEventListener('change', function(e){
        if (e.target.classList.contains('row-cb')) updateBatchUI();
      });

      // 批量操作按钮
      function batchAction(decision) {
        var ids = getCheckedIds();
        if (!ids.length) { alert('请先勾选要操作的报告'); return; }
        if (!confirm('确认将 ' + ids.length + ' 份报告标记为"' + decision + '"？')) return;
        var token = localStorage.getItem('hr_token') || '';
        var form = new FormData();
        form.append('token', token);
        form.append('decision', decision);
        form.append('session_ids', JSON.stringify(ids));
        fetch('../api/hr/batch_review.php', { method:'POST', credentials:'include', body: form })
          .then(function(r){ return r.json(); })
          .then(function(d){
            if (d.ok) { alert('批量操作成功：' + ids.length + ' 份报告已更新'); location.reload(); }
            else { alert(d.message || '操作失败'); }
          })
          .catch(function(){ alert('网络错误，请重试'); });
      }

      var batchContinueBtn = document.getElementById('batchContinueBtn');
      var batchHoldBtn = document.getElementById('batchHoldBtn');
      var batchRejectBtn = document.getElementById('batchRejectBtn');
      if (batchContinueBtn) batchContinueBtn.addEventListener('click', function(){ batchAction('continue'); });
      if (batchHoldBtn) batchHoldBtn.addEventListener('click', function(){ batchAction('hold'); });
      if (batchRejectBtn) batchRejectBtn.addEventListener('click', function(){ batchAction('reject'); });

      // 等待数据加载后初始化checkbox
      var observer = new MutationObserver(function(){
        var rowCbs = rows.querySelectorAll('input[type="checkbox"].row-cb');
        if (rowCbs.length > 0) {
          // 批量操作UI已就绪
          updateBatchUI();
        }
      });
      observer.observe(rows, { childList: true, subtree: true });
    })();
    </script>
  </body>
</html>
