<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0B2545"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#60A5FA"/></linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#93C5FD"/></linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sg"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes po{0%{r:7;opacity:.55;stroke-width:1.8}100%{r:40;opacity:0;stroke-width:.2}}
      @keyframes cb{0%,100%{r:9}35%{r:11}70%{r:8}}
      @keyframes ci{0%,100%{opacity:.85;r:4.5}35%{opacity:1;r:5}}
      @keyframes f1{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.75;transform:translateY(-4px)}}
      @keyframes f2{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:.8;transform:translateY(-3px)}}
      @keyframes f3{0%,100%{opacity:.2;transform:translateY(0) translateX(0)}50%{opacity:.7;transform:translateY(-5px) translateX(2px)}}
      @keyframes dr{0%{transform:translateY(8px);opacity:0}25%{opacity:.65}100%{transform:translateY(-10px);opacity:0}}
      @keyframes cv{0%,100%{opacity:.1}50%{opacity:.45}}
      .r1{animation:po 2.6s ease-out infinite}.r2{animation:po 2.6s ease-out infinite .87s}.r3{animation:po 2.6s ease-out infinite 1.73s}
      .core{animation:cb 2s ease-in-out infinite}.core-i{animation:ci 2s ease-in-out infinite}
      .f1{animation:f1 2.4s ease-in-out infinite}.f2{animation:f2 2s ease-in-out infinite .3s}.f3{animation:f3 2.8s ease-in-out infinite .7s}
      .f4{animation:f1 2.2s ease-in-out infinite 1.1s}.f5{animation:f2 2.6s ease-in-out infinite .5s}.f6{animation:f3 2.1s ease-in-out infinite .9s}
      .f7{animation:f1 3s ease-in-out infinite .2s}.f8{animation:f2 2.3s ease-in-out infinite 1.3s}.f9{animation:f3 2.5s ease-in-out infinite .6s}
      .f10{animation:f1 1.9s ease-in-out infinite 1s}.f11{animation:f2 2.7s ease-in-out infinite .4s}.f12{animation:f3 2.4s ease-in-out infinite 1.5s}
      .d1{animation:dr 2.2s ease-out infinite}.d2{animation:dr 2.6s ease-out infinite .8s}.d3{animation:dr 2s ease-out infinite 1.6s}
      .cv{animation:cv 2.2s ease-in-out infinite}.cvd{animation:cv 2.2s ease-in-out infinite 1.1s}
    </style>
  </defs>
