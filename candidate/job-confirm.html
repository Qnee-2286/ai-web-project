<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>确认岗位信息｜AI全量初面系统</title>
    <link rel="stylesheet" href="./styles.css?v=20260610b" />
<style id="site-footer-unified-style">
.site-footer{background:#fff;border-top:1px solid #E2E8F0;padding:40px;color:#94A3B8;font-size:12px;}
.site-footer-inner{max-width:1200px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:32px;}
.site-footer-brand{display:flex;align-items:center;gap:12px;color:#0F172A;font-weight:600;}
.site-footer-logo{width:32px;height:32px;border-radius:8px;object-fit:contain;display:block;flex-shrink:0;}
.site-footer-info{text-align:right;}
.site-footer-info p{margin:0;font-size:12px;color:#94A3B8;line-height:1.8;}
.site-footer-info a{color:#94A3B8;text-decoration:none;display:inline-flex;align-items:center;gap:4px;vertical-align:middle;}
.site-footer-info a:hover{color:#0070FF;}
.site-footer-info img{width:16px;height:16px;flex-shrink:0;}
@media(max-width:760px){.site-footer{padding:32px 20px;}.site-footer-inner{flex-direction:column;align-items:center;text-align:center;gap:14px;}.site-footer-brand{justify-content:center;}.site-footer-info{text-align:center;}.site-footer-info p{line-height:2;}}
</style>
</head>
  <body>
    <header class="top">
      <div class="brand"><img class="brand-logo" src="./assets/logo-icon.svg" alt="hi AI初面" /><span><strong>AI全量初面系统</strong><small>泓泽数字旗下产品</small></span></div>
      <span class="badge">面试前确认</span>
    </header>
    <main class="layout">
      <div class="page-title">
        <span class="crumb">候选人端 / 岗位确认</span>
        <h1>请确认公司与岗位信息</h1>
        <p>以下内容由企业 HR 填写，AI 语音将在面试开始前向你传达。</p>
      </div>
      <section class="grid two">
        <div class="panel info-list" id="jobInfoPanel">
          <div class="info-item"><span>公司名称</span><strong data-job="company_name">正在读取</strong></div>
          <div class="info-item"><span>岗位名称</span><strong data-job="job_title">正在读取</strong></div>
          <div class="info-item"><span>薪资福利</span><strong data-job="salary_benefits">正在读取</strong></div>
          <div class="info-item"><span>公司介绍</span><p data-job="company_intro">正在读取</p></div>
          <div class="info-item"><span>岗位职责</span><p data-job="responsibilities">正在读取</p></div>
          <div class="info-item"><span>任职要求</span><p data-job="requirements">正在读取</p></div>
          <div class="notice">请确认以上公司、岗位、薪资福利与招聘沟通内容一致。若信息不一致，请先返回邀请页反馈可疑岗位。</div>
          <div class="actions"><a class="btn primary" href="./device-check.html">我已确认，进入设备检查</a><a class="btn" href="./auth.html">返回实名认证</a></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
  <div class="site-footer-inner">
    <div class="site-footer-brand"><img class="site-footer-logo" src="./assets/mother-company-symbol-cropped.png" alt="泓泽数字" /><span>泓泽数字</span></div>
    <div class="site-footer-info">

    </div>
  </div>
</footer>
