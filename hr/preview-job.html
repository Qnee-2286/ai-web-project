<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>岗位预览｜AI全量初面系统</title>
    <link rel="stylesheet" href="./styles.css?v=20260602f" />
  <style id="brand-logo-clean-fix">.brand-logo{height:42px;width:auto;max-width:190px;object-fit:contain;display:block;flex-shrink:0;background:transparent!important;border-radius:0!important;padding:0!important;box-shadow:none!important;}.brand-logo-wide{height:46px;max-width:220px;}</style>
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <div class="brand">
          <img class="brand-logo brand-logo-wide" src="./assets/hi-logo-horizontal-white.svg" alt="hi AI初面" />
        </div>
        <nav class="nav">
          <a href="./dashboard.html">🏠 首页</a>
          <a class="active" href="./create-interview-flow.html?v=20260610b">✦ 创建初面</a>
          <a href="./job-management.html">📋 初面管理</a>
          <a href="./candidate-list.html">👥 候选人</a>
          <a href="./report-review-list.html">📊 报告复核</a>
          <a href="./question-bank.html">📝 题库管理</a>
          <div class="nav-sep"></div>
          <a href="./membership.html">💎 会员中心</a>
          <a href="./profile.html">⚙ 设置</a>
        </nav>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="page-title">
            <span class="crumb">HR端 / 创建岗位 / 岗位预览</span>
            <h1>岗位预览</h1>
            <p>请确认候选人将看到的岗位信息，确认后保存到岗位管理。</p>
          </div>
        </div>
        <section class="panel readonly-preview show" id="jobPreviewPanel">
          <p class="notice compact">这些内容将展示给候选人，也会作为本次面试沟通记录的一部分留痕。</p>
          <div class="readonly-grid">
            <div class="readonly-item"><span>公司名称</span><strong data-preview="company_name">未填写</strong></div>
            <div class="readonly-item"><span>岗位名称</span><strong data-preview="job_title">行政专员</strong></div>
            <div class="readonly-item"><span>岗位类型</span><strong data-preview="job_type">未选择</strong></div>
            <div class="readonly-item"><span>岗位职级</span><strong data-preview="job_level">职员</strong></div>
            <div class="readonly-item"><span>面试题库</span><strong data-preview="question_bank">行政基础题库</strong></div>
            <div class="readonly-item"><span>薪资范围</span><strong data-preview="salary">6-8K</strong></div>
            <div class="readonly-item full"><span>福利待遇</span><p data-preview="benefits">未填写</p></div>
            <div class="readonly-item full"><span>公司介绍</span><p data-preview="company_intro">未填写</p></div>
            <div class="readonly-item full"><span>岗位职责</span><p data-preview="responsibilities">未填写</p></div>
            <div class="readonly-item full"><span>任职要求</span><p data-preview="requirements">未填写</p></div>
          </div>
          <div class="actions" style="margin-top: 18px">
            <a class="btn" href="./create-interview-flow.html?v=20260610b">返回修改</a>
            <button class="btn primary" type="button" id="confirmSaveJob">确认保存</button>
          </div>
        </section>
      </main>
    </div>
    <div class="mps-beian"><a href="https://beian.mps.gov.cn/#/query/webSearch?code=44010302111445" rel="noreferrer" target="_blank"><img src="./assets/beian.png" alt="公安备案图标" /><span>粤公网安备44010302111445号</span></a></div>
    <script src="./auth-flow.js?v=20260610b"></script>
    <script>
      (() => {
        const saved = JSON.parse(sessionStorage.getItem('job_preview_payload') || '{}');
        const data = Object.keys(saved).length ? saved : {
          company_name: '',
          job_title: '行政专员',
          job_type: '',
          job_direction: '',
          job_level: 'entry_staff',
          question_bank: '行政基础题库',
          salary_min_k: '6',
          salary_max_k: '8',
          benefits: '',
          company_intro: '未填写',
          responsibilities: '未填写',
          requirements: '未填写'
        };
        const set = (name, value) => {
          const el = document.querySelector(`[data-preview="${name}"]`);
          if (el) el.textContent = value || '未填写';
        };
        set('company_name', data.company_name);
        set('job_title', data.job_title);
        const typeMap = {sales_business:'销售/商务',marketing_operation:'市场/运营',customer_service:'客服/服务',retail_store:'门店/零售',logistics_delivery:'物流/仓储/配送',production_manufacturing:'生产/制造',food_hospitality:'餐饮/酒店',life_property_service:'家政/生活服务',administration:'职能/行政',human_resources:'人力资源',finance_legal:'财务/法务',tech_rd:'技术/研发',product_design:'产品/设计',education_training:'教育/培训',medical_health:'医疗/健康',construction_property:'建筑/工程/物业',flexible_parttime:'灵活用工/兼职',other:'其他'};
        const levelMap = {intern_parttime:'实习/兼职',entry_staff:'基层员工',senior_staff:'资深员工',lead_supervisor:'主管/组长',manager:'经理',director_plus:'总监及以上',staff:'基层员工',management:'经理'};
        set('job_type', [typeMap[data.job_type] || data.job_type, data.job_direction].filter(Boolean).join(' · ') || '未选择');
        set('job_level', levelMap[data.job_level] || '基层员工');
        set('question_bank', data.question_bank || '未选择');
        set('salary', `${data.salary_min_k || '-'}-${data.salary_max_k || '-'}K`);
        set('benefits', data.benefits);
        set('company_intro', data.company_intro);
        set('responsibilities', data.responsibilities);
        set('requirements', data.requirements);
        document.getElementById('confirmSaveJob')?.addEventListener('click', () => {
          sessionStorage.removeItem('job_preview_payload');
          location.href = './job-management.html';
        });
      })();
    </script>
  </body>
</html>
