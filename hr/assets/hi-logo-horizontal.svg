    <circle cx="96" cy="70" r=".8" fill="#BFDBFE" class="d4"/>
    <line x1="48" y1="42" x2="60" y2="53" stroke="#3B82F6" stroke-width="1" class="cv"/>
    <line x1="80" y1="70" x2="68" y2="58" stroke="#60A5FA" stroke-width="1" class="cvd"/>
    <line x1="52" y1="72" x2="62" y2="58" stroke="#3B82F6" stroke-width=".8" class="cv"/>
    <circle cx="64" cy="56" r="8" fill="url(#c3)" filter="url(#glow)" class="core"/>
    <circle cx="64" cy="56" r="4" fill="white" opacity=".9" class="core-i"/>
  </g>
