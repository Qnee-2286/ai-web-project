<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="hi-build" content="20260615cachefix" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手机号快捷登录/注册｜AI全量初面系统</title>
    <link rel="stylesheet" href="./v2-design-system.css?v=20260615cachefix" />
    <style>
      .quick-note { margin: 10px 0 18px; color: var(--muted); font-size: 14px; line-height: 1.7; }
      .auth-links { display: flex; justify-content: center; gap: 18px; margin-top: 18px; font-size: 14px; }
      .auth-links a { color: var(--blue); font-weight: 800; text-decoration: none; }
      .inline-code-button {
        margin-top: 8px;
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--blue);
        border-radius: 8px;
        background: #EFF6FF;
        color: var(--blue);
        font-weight: 800;
        cursor: pointer;
      }
      .form-message { margin: 12px 0; padding: 10px 12px; border-radius: 8px; color: #EF4444; background: #FEF2F2; font-size: 14px; }
      .form-message.ok { color: #047857; background: #ECFDF5; }
      .auth-brand-wordmark{display:block!important;width:260px!important;max-width:82%!important;height:auto!important;margin-bottom:44px!important;background:transparent!important;border-radius:0!important;padding:0!important;box-shadow:none!important;overflow:visible!important;flex:none!important;}.auth-brand-wordmark img{display:block!important;width:100%!important;height:auto!important;max-width:none!important;min-width:0!important;object-fit:contain!important;background:transparent!important;border-radius:0!important;padding:0!important;box-shadow:none!important;}
    </style>
  <style id="site-footer-unified-style">
.site-footer{background:#fff;border-top:1px solid #E2E8F0;padding:40px;color:#94A3B8;font-size:12px;}
.site-footer-inner{max-width:1200px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:32px;}
.site-footer-brand{display:flex;align-items:center;gap:12px;color:#0F172A;font-weight:600;}.brand-logo{height:42px;width:auto;max-width:190px;object-fit:contain;display:block;flex-shrink:0;background:transparent;border-radius:0;padding:0;box-shadow:none;}.brand-logo-wide{height:56px;max-width:260px;}
.site-footer-logo{height:28px;width:auto;max-width:160px;object-fit:contain;display:block;flex-shrink:0;background:transparent;border-radius:0;padding:0;box-shadow:none;}.site-footer-logo-wide{height:30px;max-width:170px;}
.site-footer-info{text-align:right;}
.site-footer-info p{margin:0;font-size:12px;color:#94A3B8;line-height:1.8;}
.site-footer-info a{color:#94A3B8;text-decoration:none;display:inline-flex;align-items:center;gap:4px;vertical-align:middle;}
.site-footer-info a:hover{color:#0070FF;}
.site-footer-info img{width:16px;height:16px;flex-shrink:0;}
@media(max-width:760px){.site-footer{padding:32px 20px;}.site-footer-inner{flex-direction:column;align-items:center;text-align:center;gap:14px;}.site-footer-brand{justify-content:center;}.brand-logo{height:42px;width:auto;max-width:190px;object-fit:contain;display:block;flex-shrink:0;background:transparent;border-radius:0;padding:0;box-shadow:none;}.brand-logo-wide{height:56px;max-width:260px;}.site-footer-info{text-align:center;}.site-footer-info p{line-height:2;}}
</style>
</head>
  <body>
    <main class="auth-layout">
      <section class="auth-hero">
        <div class="auth-brand-wordmark"><img src="./assets/hi-logo-horizontal-white.svg" alt="hi AI初面" /></div>
        <h1>手机号快捷登录/注册</h1>
        <p>已有手机号账号将直接登录；新手机号会创建账号，并进入设置密码、绑定邮箱和实名认证流程。</p>
      </section>
      <section class="auth-card">
        <div class="auth-panel">
          <h2>快捷登录/注册</h2>
          <p class="quick-note">适合第一次体验或忘记密码时使用。已有账号验证后会按当前账号状态继续。</p>
          <form id="entryForm" novalidate>
            <div class="field">
              <label for="entryPhone">手机号</label>
              <input id="entryPhone" name="phone" autocomplete="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号" />
            </div>
            <div class="field">
              <label for="entrySmsCode">短信验证码</label>
              <input id="entrySmsCode" name="sms_code" inputmode="numeric" maxlength="6" placeholder="请输入短信验证码" />
            </div>
            <button type="submit" class="btn primary">验证手机号，继续</button>
          </form>
          <div class="auth-links">
            <a href="./login.html">已有账号，使用密码登录</a>
            <a href="./register.html">填写资料注册</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
  <div class="site-footer-inner">
    <div class="site-footer-brand"><img class="site-footer-logo site-footer-logo-wide" src="./assets/hi-logo-horizontal.svg" alt="hi AI初面" /></div>
    <div class="site-footer-info">
      <p>AI全量初面系统 &middot; Powered by <a href="https://www.hongzedigital.com">泓泽数字</a></p>
      <p><a href="../help.html">使用说明</a> &middot; <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">粤ICP备2026055553号</a> &middot; <a href="https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=44010302111445" target="_blank" rel="noreferrer"><img src="./assets/beian.png" alt="公安备案图标" />粤公网安备44010302111445号</a></p>
    </div>
  </div>
</footer>

    <script>
    (() => {
      const API = '../api';
      const form = document.getElementById('entryForm');
      const phoneInput = document.getElementById('entryPhone');
      const codeInput = document.getElementById('entrySmsCode');
      const submitBtn = form.querySelector('.btn.primary');

      function message(text, ok) {
        let box = form.querySelector('.form-message');
        if (!box) { box = document.createElement('div'); box.className = 'form-message'; form.prepend(box); }
        box.textContent = text;
        box.classList.toggle('ok', !!ok);
      }

      async function post(path, payload) {
        const res = await fetch(API + '/' + path, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'include',
          body: JSON.stringify(payload || {})
        });
        const data = await res.json().catch(() => ({ok:false, message:'接口返回格式错误'}));
        if (!res.ok || !data.ok) throw new Error(data.message || '请求失败');
        return data;
      }

      const sendBtn = document.createElement('button');
      sendBtn.type = 'button';
      sendBtn.className = 'inline-code-button';
      sendBtn.textContent = '发送验证码';
      codeInput.insertAdjacentElement('afterend', sendBtn);

      function startCooldown() {
        let left = 60;
        sendBtn.disabled = true;
        sendBtn.textContent = '重新发送(' + left + 's)';
        const timer = setInterval(() => {
          left--;
          sendBtn.textContent = '重新发送(' + left + 's)';
          if (left <= 0) { clearInterval(timer); sendBtn.disabled = false; sendBtn.textContent = '发送验证码'; }
        }, 1000);
      }

      sendBtn.addEventListener('click', async () => {
        const phone = phoneInput.value.trim();
        if (!/^1\d{10}$/.test(phone)) { message('请输入正确的手机号'); return; }
        sendBtn.disabled = true;
        sendBtn.textContent = '发送中...';
        try {
          await post('auth/send_sms_code.php', {phone, purpose: 'hr_entry'});
          message('验证码已发送，请查看手机短信。', true);
          startCooldown();
        } catch (err) {
          sendBtn.disabled = false;
          sendBtn.textContent = '发送验证码';
          message(err.message || '验证码发送失败');
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const phone = phoneInput.value.trim();
        const sms_code = codeInput.value.trim();
        if (!/^1\d{10}$/.test(phone)) { message('请输入正确的手机号'); return; }
        if (!sms_code) { message('请输入短信验证码'); return; }
        submitBtn.disabled = true;
        submitBtn.textContent = '验证中...';
        try {
          const res = await post('auth/hr_auth.php', {phone, sms_code});
          message(res.message || '验证成功', true);
          location.href = (res.data && res.data.next) || './dashboard.html';
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = '验证手机号，继续';
          message(err.message || '验证失败');
        }
      });
    })();
    </script>
  </body>
</html>
