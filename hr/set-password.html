<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>设置密码｜AI全量初面系统</title>
    <link rel="stylesheet" href="./v2-design-system.css?v=20260615cachefix" />
    <style>
      body { min-height: 100vh; display: flex; flex-direction: column; }
      .auth-layout { flex: 1; }
      .auth-panel h2 { margin-bottom: 20px; }
      .auth-links { display: flex; justify-content: center; gap: 24px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
      .auth-links a { font-size: 13px; color: var(--text-secondary); font-weight: 600; transition: color .2s; }
      .auth-links a:hover { color: var(--gradient-start); }
    </style>
  <style id="site-footer-unified-style">
.site-footer{background:#fff;border-top:1px solid #E2E8F0;padding:40px;color:#94A3B8;font-size:12px;}
.site-footer-inner{max-width:1200px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:32px;}
.site-footer-brand{display:flex;align-items:center;gap:12px;color:#0F172A;font-weight:600;}
.site-footer-logo{width:32px;height:32px;border-radius:8px;object-fit:contain;display:block;flex-shrink:0;}
.site-footer-info{text-align:right;}
.site-footer-info p{margin:0;font-size:12px;color:#94A3B8;line-height:1.8;}
.site-footer-info a{color:#94A3B8;text-decoration:none;display:inline-flex;align-items:center;gap:4px;vertical-align:middle;}
.site-footer-info a:hover{color:#0070FF;}
.site-footer-info img{width:16px;height:16px;flex-shrink:0;}
@media(max-width:760px){.site-footer{padding:32px 20px;}.site-footer-inner{flex-direction:column;align-items:center;text-align:center;gap:14px;}.site-footer-brand{justify-content:center;}.site-footer-info{text-align:center;}.site-footer-info p{line-height:2;}}
</style>
</head>
  <body>
    <main class="auth-layout">
      <!-- ====== 左侧品牌展示 ====== -->
      <section class="auth-hero">
        <div class="brand">
          <img class="brand-logo" src="./assets/logo-icon.svg" alt="hi AI初面" style="background:none;padding:0;" />
          <span><strong>AI全量初面系统</strong><small>泓泽数字旗下产品</small></span>
        </div>
        <h1>设置密码</h1>
        <p>为新账号设置一个安全的登录密码，密码长度至少8位，建议包含字母和数字。</p>
        <ul class="hero-features">
          <li><span class="feat-icon">&#9878;</span>AI语音初面，自动追问与记录</li>
          <li><span class="feat-icon">&#9733;</span>智能匹配报告，辅助人才筛选</li>
          <li><span class="feat-icon">&#9873;</span>候选人数据加密，合规可控</li>
        </ul>
      </section>

      <!-- ====== 右侧设置密码表单 ====== -->
      <section class="auth-card">
        <div class="auth-panel">
          <h2>设置登录密码</h2>
          <form id="setPasswordForm">
            <div class="field">
              <label for="setPassword">登录密码</label>
              <div class="password-wrap">
                <input id="setPassword" name="password" type="password" autocomplete="new-password" placeholder="请输入登录密码（至少8位）" />
                <button type="button" class="password-toggle" data-target="setPassword">显示</button>
              </div>
            </div>
            <div class="field">
              <label for="setPasswordConfirm">确认密码</label>
              <div class="password-wrap">
                <input id="setPasswordConfirm" name="password_confirm" type="password" autocomplete="new-password" placeholder="请再次输入密码" />
                <button type="button" class="password-toggle" data-target="setPasswordConfirm">显示</button>
              </div>
            </div>
            <button type="submit" class="btn primary">保存密码</button>
          </form>
          <div class="auth-links">
            <a href="./login.html">返回登录</a>
          </div>
        </div>
      </section>
    </main>

    <!-- 公安备案 -->
    <footer class="site-footer">
  <div class="site-footer-inner">
    <div class="site-footer-brand"><img class="site-footer-logo" src="./assets/mother-company-symbol-cropped.png" alt="泓泽数字" /><span>泓泽数字</span></div>
    <div class="site-footer-info">
      <p>AI全量初面系统 &middot; Powered by <a href="https://www.hongzedigital.com">泓泽数字</a></p>
      <p><a href="../help.html">使用说明</a> &middot; <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">粤ICP备2026055553号</a> &middot; <a href="https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=44010302111445" target="_blank" rel="noreferrer"><img src="./assets/beian.png" alt="公安备案图标" />粤公网安备44010302111445号</a></p>
    </div>
  </div>
</footer>

    <script>
    (() => {
      const API = '../api';
      const form = document.getElementById('setPasswordForm');
      if (!form) return;

      const pwdInput = document.getElementById('setPassword');
      const confirmInput = document.getElementById('setPasswordConfirm');
      const submitBtn = form.querySelector('.btn.primary');

      function message(formEl, text, ok) {
        let box = formEl.querySelector('.form-message');
        if (!box) {
          box = document.createElement('div');
          box.className = 'form-message';
          formEl.prepend(box);
        }
        box.textContent = text;
        box.classList.toggle('ok', !!ok);
      }
      async function post(path, payload) {
        const res = await fetch(API + '/' + path, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'include',
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({ok:false, message:'接口返回格式错误'}));
        if (data && data.data && data.data.need_login) {
          location.href = './login.html';
          return new Promise(() => {});
        }
        if (!res.ok || !data.ok) throw new Error((data.message || '请求失败') + (data.data && data.data.error ? '：' + data.data.error : ''));
        return data;
      }

      /* --- 密码显示/隐藏切换 --- */
      form.querySelectorAll('.password-toggle[data-target]').forEach((button) => {
        const input = document.getElementById(button.dataset.target);
        if (!input) return;
        button.addEventListener('click', () => {
          const visible = input.type === 'text';
          input.type = visible ? 'password' : 'text';
          button.textContent = visible ? '显示' : '隐藏';
        });
      });

      /* --- 表单提交 --- */
      submitBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const password = pwdInput.value;
        const confirm = confirmInput.value;
        if (!password) { message(form, '请输入登录密码'); return; }
        if (password.length < 8) { message(form, '密码长度至少8位'); return; }
        if (password !== confirm) { message(form, '两次输入的密码不一致'); return; }
        submitBtn.disabled = true;
        submitBtn.textContent = '处理中...';
        try {
          const res = await post('auth/hr_set_password.php', {password: password, password_confirm: confirm});
          message(form, res.message, true);
          setTimeout(() => { location.href = (res.data && res.data.next) || './bind-email.html'; }, 500);
        } catch (err) {
          message(form, err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = '保存密码';
        }
      });
    })();
    </script>
  </body>
</html>
