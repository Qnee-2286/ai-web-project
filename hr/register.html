<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="hi-build" content="20260615cachefix" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR注册｜AI全量初面系统</title>
    <link rel="stylesheet" href="./v2-design-system.css?v=20260615cachefix" />
    <style>
      body { min-height: 100vh; display: flex; flex-direction: column; }
      .auth-layout { flex: 1; }
      .subtitle { font-size: 14px; color: rgba(255,255,255,.55); margin-top: 8px; position: relative; z-index: 1; }
      .auth-panel h2 { margin-bottom: 20px; }
      .btn.primary { margin-top: 12px; }
      .auth-links { display: flex; justify-content: center; gap: 24px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
      .auth-links a { font-size: 13px; color: var(--text-secondary); font-weight: 600; transition: color .2s; }
      .auth-links a:hover { color: var(--gradient-start); }
    </style>
  <style id="site-footer-unified-style">
.site-footer{background:#fff;border-top:1px solid #E2E8F0;padding:40px;color:#94A3B8;font-size:12px;}
.site-footer-inner{max-width:1200px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:32px;}
.site-footer-brand{display:flex;align-items:center;gap:12px;color:#0F172A;font-weight:600;}
.site-footer-logo{width:32px;height:32px;border-radius:8px;object-fit:contain;display:block;flex-shrink:0;}
.site-footer-info{text-align:right;}
.site-footer-info p{margin:0;font-size:12px;color:#94A3B8;line-height:1.8;}
.site-footer-info a{color:#94A3B8;text-decoration:none;display:inline-flex;align-items:center;gap:4px;vertical-align:middle;}
.site-footer-info a:hover{color:#0070FF;}
.site-footer-info img{width:16px;height:16px;flex-shrink:0;}
@media(max-width:760px){.site-footer{padding:32px 20px;}.site-footer-inner{flex-direction:column;align-items:center;text-align:center;gap:14px;}.site-footer-brand{justify-content:center;}.site-footer-info{text-align:center;}.site-footer-info p{line-height:2;}}
</style>
</head>
  <body>
    <main class="auth-layout">
      <!-- ====== 左侧品牌展示 ====== -->
      <section class="auth-hero">
        <div class="brand">
          <img class="brand-logo" src="./assets/logo-icon.svg" alt="hi AI初面" style="background:none;padding:0;" />
          <span><strong>AI全量初面系统</strong><small>泓泽数字旗下产品</small></span>
        </div>
        <h1>注册HR账号</h1>
        <p>HR会发起初面、查看候选人资料和接收报告，所以注册后需要绑定邮箱并完成实名认证。</p>
        <ul class="hero-features">
          <li><span class="feat-icon">&#9878;</span>AI语音初面，自动追问与记录</li>
          <li><span class="feat-icon">&#9733;</span>智能匹配报告，辅助人才筛选</li>
          <li><span class="feat-icon">&#9873;</span>候选人数据加密，合规可控</li>
        </ul>
      </section>

      <!-- ====== 右侧注册表单 ====== -->
      <section class="auth-card">
        <div class="auth-panel">
          <h2>创建账号</h2>
          <form>
            <div class="field">
              <label for="registerName">姓名</label>
              <input id="registerName" name="name" autocomplete="name" placeholder="请输入真实姓名" />
            </div>
            <div class="field">
              <label for="registerPhone">手机号</label>
              <input id="registerPhone" name="phone" autocomplete="tel" inputmode="numeric" placeholder="请输入手机号" />
            </div>
            <div class="field">
              <label for="registerSmsCode">短信验证码</label>
              <div class="code-field-wrap">
                <input id="registerSmsCode" name="sms_code" inputmode="numeric" placeholder="请输入短信验证码" />
              </div>
            </div>
            <div class="field">
              <label for="registerPassword">设置密码</label>
              <input id="registerPassword" name="password" placeholder="请输入登录密码" type="password" autocomplete="new-password" />
            </div>
            <div class="field">
              <label for="registerPasswordConfirm">确认密码</label>
              <input id="registerPasswordConfirm" name="password_confirm" placeholder="请再次输入密码" type="password" autocomplete="new-password" />
            </div>
            <label class="check-row">
              <input id="registerAgreement" name="agreement" type="checkbox" />
              我已阅读并同意用户注册协议、隐私政策及账号安全授权。
            </label>
            <button type="submit" class="btn primary">下一步 绑定邮箱</button>
          </form>
          <div class="auth-links">
            <a href="./login.html">已有账号？返回登录</a>
          </div>
        </div>
      </section>
    </main>

    <!-- 公安备案 -->
    <footer class="site-footer">
  <div class="site-footer-inner">
    <div class="site-footer-brand"><img class="site-footer-logo" src="./assets/mother-company-symbol-cropped.png" alt="泓泽数字" /><span>泓泽数字</span></div>
    <div class="site-footer-info">
      <p>AI全量初面系统 &middot; Powered by <a href="https://www.hongzedigital.com">泓泽数字</a></p>
      <p><a href="../help.html">使用说明</a> &middot; <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">粤ICP备2026055553号</a> &middot; <a href="https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=44010302111445" target="_blank" rel="noreferrer"><img src="./assets/beian.png" alt="公安备案图标" />粤公网安备44010302111445号</a></p>
    </div>
  </div>
</footer>

    <script>
    (() => {
      const API = '../api';
      const form = document.querySelector('form');
      if (!form) return;

      const nameInput = document.getElementById('registerName');
      const phoneInput = document.getElementById('registerPhone');
      const codeInput = document.getElementById('registerSmsCode');
      const passwordInput = document.getElementById('registerPassword');
      const confirmInput = document.getElementById('registerPasswordConfirm');
      const agreementInput = document.getElementById('registerAgreement');

      function $(sel, root) { return (root || document).querySelector(sel); }
      function message(formEl, text, ok) {
        let box = formEl.querySelector('.form-message');
        if (!box) {
          box = document.createElement('div');
          box.className = 'form-message';
          formEl.prepend(box);
        }
        box.textContent = text;
        box.classList.toggle('ok', !!ok);
      }
      async function post(path, payload) {
        const res = await fetch(API + '/' + path, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'include',
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({ok:false, message:'接口返回格式错误'}));
        if (data && data.data && data.data.need_login) {
          location.href = './login.html';
          return new Promise(() => {});
        }
        if (!res.ok || !data.ok) throw new Error((data.message || '请求失败') + (data.data && data.data.error ? '：' + data.data.error : ''));
        return data;
      }

      /* --- 验证码发送按钮 --- */
      if (codeInput) {
        const sendBtn = document.createElement('button');
        sendBtn.type = 'button';
        sendBtn.className = 'inline-code-button';
        sendBtn.textContent = '发送验证码';
        codeInput.insertAdjacentElement('afterend', sendBtn);
        let timer = null;
        const startCooldown = () => {
          let left = 60;
          clearInterval(timer);
          sendBtn.disabled = true;
          sendBtn.textContent = '重新发送(' + left + 's)';
          timer = setInterval(() => {
            left--;
            sendBtn.textContent = '重新发送(' + left + 's)';
            if (left <= 0) { clearInterval(timer); sendBtn.disabled = false; sendBtn.textContent = '重新发送'; }
          }, 1000);
        };
        sendBtn.addEventListener('click', async () => {
          const phone = phoneInput.value.trim();
          if (!phone) { message(form, '请先输入手机号'); return; }
          sendBtn.disabled = true;
          sendBtn.textContent = '发送中...';
          try {
            await post('auth/send_sms_code.php', {phone, purpose:'hr_register'});
            message(form, '验证码已发送，请查看手机短信。', true);
            startCooldown();
          } catch (err) {
            alert(err.message);
            sendBtn.disabled = false;
            sendBtn.textContent = '重新发送';
          }
        });
      }

      /* --- 表单提交 --- */
      const submitBtn = form.querySelector('.btn.primary');
      if (submitBtn) {
        submitBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          try {
            const res = await post('auth/hr_register.php', {
              name: nameInput.value.trim(),
              phone: phoneInput.value.trim(),
              sms_code: codeInput.value.trim(),
              password: passwordInput.value,
              password_confirm: confirmInput.value,
              agreement: agreementInput.checked
            });
            message(form, res.message, true);
            location.href = res.data.next || './bind-email.html';
          } catch (err) {
            message(form, err.message);
          }
        });
      }
    })();
    </script>
  </body>
</html>
